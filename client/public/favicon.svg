<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="billboard-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E40AF" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <linearGradient id="bolt-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFAE00" />
      <stop offset="50%" stop-color="#FF6B00" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>
    <linearGradient id="screen-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#F97316" stop-opacity="0.15" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#FF6B00" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Billboard Stand & Base -->
  <rect x="22" y="37" width="4" height="6" rx="1" fill="#475569" />
  <path d="M16 43h16" stroke="#475569" stroke-width="2.5" stroke-linecap="round" />

  <!-- Billboard Display Screen Frame / Outer 'F' Housing -->
  <rect x="6" y="6" width="36" height="29" rx="6" fill="#0B0F17" stroke="url(#billboard-grad)" stroke-width="2.5" />
  
  <!-- Digital Screen Surface -->
  <rect x="9" y="9" width="30" height="23" rx="4" fill="#0F172A" />
  <rect x="9" y="9" width="30" height="23" rx="4" fill="url(#screen-glow)" />

  <!-- Stylized Geometric 'F' Digital Matrix -->
  <!-- Vertical Stem of F -->
  <rect x="13" y="13" width="4.5" height="15" rx="2" fill="url(#billboard-grad)" />
  <!-- Top Bar of F -->
  <rect x="13" y="13" width="14" height="4" rx="2" fill="url(#billboard-grad)" />
  <!-- Middle Bar of F -->
  <rect x="13" y="19" width="9.5" height="3.5" rx="1.75" fill="url(#billboard-grad)" />

  <!-- Dynamic Electric Flash / Lightning Bolt -->
  <polygon points="27,6 18,21 24.5,21 20,34 32,17.5 25.5,17.5" fill="url(#bolt-grad)" filter="url(#glow)" />
  
  <!-- Screen Status LED indicator -->
  <circle cx="34" cy="12" r="1.2" fill="#22C55E" />
</svg>