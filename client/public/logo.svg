<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" fill="none">
  <defs>
    <linearGradient id="logo-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E40AF" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <linearGradient id="logo-orange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFAE00" />
      <stop offset="50%" stop-color="#FF6B00" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>
    <linearGradient id="screen-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#F97316" stop-opacity="0.15" />
    </linearGradient>
    <filter id="logo-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#FF6B00" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- ICON GROUP -->
  <g transform="translate(10, 8) scale(1.35)">
    <!-- Stand -->
    <rect x="22" y="37" width="4" height="6" rx="1" fill="#64748B" />
    <path d="M16 43h16" stroke="#64748B" stroke-width="2.5" stroke-linecap="round" />

    <!-- Billboard Outer Screen Frame -->
    <rect x="6" y="6" width="36" height="29" rx="6" fill="#0B0F17" stroke="url(#logo-blue)" stroke-width="2.5" />
    
    <!-- Screen Surface -->
    <rect x="9" y="9" width="30" height="23" rx="4" fill="#0F172A" />
    <rect x="9" y="9" width="30" height="23" rx="4" fill="url(#screen-glow)" />

    <!-- 'F' Digital Matrix -->
    <rect x="13" y="13" width="4.5" height="15" rx="2" fill="url(#logo-blue)" />
    <rect x="13" y="13" width="14" height="4" rx="2" fill="url(#logo-blue)" />
    <rect x="13" y="19" width="9.5" height="3.5" rx="1.75" fill="url(#logo-blue)" />

    <!-- Lightning Bolt -->
    <polygon points="27,6 18,21 24.5,21 20,34 32,17.5 25.5,17.5" fill="url(#logo-orange)" filter="url(#logo-glow)" />
    
    <!-- LED Dot -->
    <circle cx="34" cy="12" r="1.2" fill="#22C55E" />
  </g>

  <!-- WORDMARK: FlashAds -->
  <text x="86" y="44" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="34" font-weight="800" letter-spacing="-0.5">
    <tspan fill="#0F172A">Flash</tspan><tspan fill="url(#logo-orange)">Ads</tspan>
  </text>

  <!-- TAGLINE: Find. Book. Advertise. -->
  <text x="88" y="64" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="600" fill="#64748B" letter-spacing="2">
    FIND. BOOK. ADVERTISE.
  </text>
</svg>
